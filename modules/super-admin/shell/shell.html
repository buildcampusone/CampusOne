<!--
  shell.html
  ---------------------------------------------------------
  The one layout frame every Super Admin route lives inside.
  dashboard.html (and every future module page) gets injected
  into #ci-workspace — it never redefines sidebar/topbar/etc.
  ---------------------------------------------------------
-->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CampusOne — Super Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />

 <link rel="stylesheet" href="./shell.css" />
<link rel="stylesheet" href="../components/sidebar/sidebar.css" />
<link rel="stylesheet" href="../topbar/topbar.css" />
<link rel="stylesheet" href="../activity-panel/activity-panel.css" />
<link rel="stylesheet" href="../status-bar/status-bar.css" />
</head>
<body>

  <div id="ci-shell" class="ci-shell">

    <!-- Sidebar mounts here (sidebar.component.js) -->
    <div id="ci-sidebar-slot"></div>

    <div class="ci-shell__body">
      <!-- Topbar mounts here (topbar.component.js) -->
      <div id="ci-topbar-slot"></div>

      <div class="ci-shell__content">
        <!-- Route pages (e.g. dashboard.html) mount here -->
        <main id="ci-workspace" class="ci-workspace" tabindex="-1"></main>

        <!-- Activity panel mounts here (activity-panel.component.js) -->
        <div id="ci-activity-panel-slot"></div>
      </div>

      <!-- Status bar mounts here (status-bar.component.js) — desktop only -->
      <div id="ci-status-bar-slot"></div>
    </div>
  </div>

  <!-- Mobile bottom navigation — everything else lives in the sidebar drawer -->
  <nav class="ci-bottomnav" aria-label="Primary mobile navigation">
    <button class="ci-bottomnav__btn is-active" data-bottom-route="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>
      <span>Home</span>
    </button>
    <button class="ci-bottomnav__btn" data-bottom-route="institutions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 8h2M13 8h2M9 12h2M13 12h2"/></svg>
      <span>Institutes</span>
    </button>
    <button class="ci-bottomnav__btn ci-bottomnav__btn--fab" data-action="quick-add" aria-label="Quick add">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="ci-bottomnav__btn" data-action="open-activity">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 10a6 6 0 0 1 12 0c0 5 1.5 6 1.5 6h-15S6 15 6 10Z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
      <span>Activity</span>
    </button>
    <button class="ci-bottomnav__btn" data-action="open-profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg>
      <span>Profile</span>
    </button>
  </nav>

  <script type="module" src="./shell.page.js"></script>
</body>
</html>
